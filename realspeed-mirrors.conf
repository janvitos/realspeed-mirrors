# /etc/conf.d/realspeed-mirrors.conf
# Sourced by realspeed-mirrors as bash. Uncomment to override a default.
# /etc/conf.d/cachyos-rate-mirrors.env is read first, so settings you already
# made for cachyos-rate-mirrors (e.g. RATE_MIRRORS_ENTRY_COUNTRY) still apply;
# anything set here wins.

# --- Speed test ---------------------------------------------------------------
# Candidate mirrors taken from rate-mirrors per repo family (Arch, CachyOS).
#CANDIDATES=10
# Each test downloads up to TEST_BYTES or runs for TEST_SECS, whichever comes first.
# One run downloads roughly (CANDIDATES + RETEST_TOP) x TEST_BYTES per repo family.
#TEST_BYTES=20000000
#TEST_SECS=8
# Re-test the N fastest mirrors with a second random package and keep the
# lower of the two speeds (0 disables the re-test).
#RETEST_TOP=5
# Size window (bytes) for the randomly picked test packages.
#MIN_PKG=15000000
#MAX_PKG=100000000

# --- Extra candidates ---------------------------------------------------------
# Always tested and ranked on measured speed, never forced to the top.
# Use $repo and $arch exactly as in a pacman mirrorlist. Set to () to disable.
#EXTRA_ARCH_MIRRORS=(
#    'https://archlinux.cachyos.org/repo/$repo/os/$arch'
#    'https://mirror.zyner.org/archlinux/$repo/os/$arch'
#)
#EXTRA_CACHYOS_MIRRORS=(
#    'https://cdn77.cachyos.org/repo/$arch/$repo'
#)

# --- rate-mirrors options (candidate discovery) -------------------------------
# Any RATE_MIRRORS_* variable from `rate-mirrors --help` works here.
# The entry country is auto-detected when not set.
#RATE_MIRRORS_ENTRY_COUNTRY=DE
#RATE_MIRRORS_COUNTRY_NEIGHBORS_PER_COUNTRY=3
#RATE_MIRRORS_EXCLUDE_COUNTRIES=RU,CN
